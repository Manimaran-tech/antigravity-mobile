[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-mobile"
dynamic = ["version"]
description = "A remote monitor and scheduler CLI tool for Antigravity 2.0 IDE"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Manimaran" }
]
keywords = ["antigravity", "ide", "remote-monitoring", "fastapi", "cli", "mobile-dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.0",
    "websockets>=11.0",
    "psutil>=5.9.0"
]

[project.urls]
Homepage = "https://github.com/Manimaran-tech/antigravity-mobile"
Repository = "https://github.com/Manimaran-tech/antigravity-mobile"
Issues = "https://github.com/Manimaran-tech/antigravity-mobile/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[project.scripts]
antigravity-mobile = "antigravity_remote.cli:main"

[tool.setuptools.packages.find]
include = ["antigravity_remote*"]

[tool.setuptools.dynamic]
version = {attr = "antigravity_remote.__version__"}

[tool.setuptools.package-data]
antigravity_remote = [
    "templates/*.html",
    "static/**/*.css",
    "static/**/*.js"
]
